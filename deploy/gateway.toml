# Cấu hình fomoxa-gateway cho cụm test local.
# Chạy từ thư mục deploy/:  ..\gateway\target\release\fomoxa-gateway.exe gateway.toml
# Đường dẫn trong [keys] tính theo thư mục hiện tại lúc chạy.

listen = "0.0.0.0:7777"
pod_bind = "0.0.0.0:0"
directory = "127.0.0.1:9500"
retry_seconds = 1

[keys]
gateway = { file = "secrets/directory/gateway" }
