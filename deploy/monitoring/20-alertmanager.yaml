# Alertmanager: mac dinh chi gom nhom canh bao (receiver "default" khong gui di dau).
# De nhan thong bao that, sua `receivers` ben duoi (vi du Slack / webhook) roi:
#   kubectl apply -f deploy/monitoring/20-alertmanager.yaml && kubectl rollout restart deploy/alertmanager -n monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: default
        # Vi du Slack:
        # slack_configs:
        #   - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
        #     channel: "#fomoxa-alerts"
        #     send_resolved: true
        # Vi du webhook:
        # webhook_configs:
        #   - url: http://example.internal/alerts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - containerPort: 9093
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector: { app: alertmanager }
  ports:
    - { name: web, port: 9093, targetPort: 9093 }
