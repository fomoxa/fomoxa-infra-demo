# Grafana: datasource Prometheus + Loki va dashboard "Fomoxa - tong quan" duoc nap san.
# Mat khau admin nam trong Secret `grafana-admin` (k8s-up tao ngau nhien):
#   kubectl get secret grafana-admin -n monitoring -o jsonpath='{.data.password}' | base64 -d
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: fomoxa
        folder: Fomoxa
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
