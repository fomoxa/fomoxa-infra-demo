# Postgres + Nakama cho cụm test local (P4).
# Chạy từ thư mục deploy/:  docker compose up -d
# Console: http://127.0.0.1:7351  (admin / password: admin)
# API:     http://127.0.0.1:7350
# Module Lua: ./nakama/modules -> /nakama/data/modules

name: fomoxa-test

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 20

  nakama:
    image: heroiclabs/nakama:3.41.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1
        --database.address postgres:localdb@postgres:5432/nakama
        --logger.level INFO
        --session.token_expiry_sec 7200
        --console.username admin
        --console.password admin
    ports:
      - "7350:7350"
      - "7351:7351"
    volumes:
      - ./nakama:/nakama/data

volumes:
  pgdata:
