apiVersion: "agones.dev/v1"
kind: Fleet
metadata:
  name: fomoxa-server
  namespace: fomoxa
spec:
  replicas: 4
  template:
    spec:
      ports:
        - name: default
          containerPort: 7778
          protocol: UDP
          portPolicy: None
      health:
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 3
      template:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9611"
            prometheus.io/path: "/metrics"
        spec:
          terminationGracePeriodSeconds: 360
          containers:
            - name: fomoxa-server
              image: fomoxa-server:latest
              resources:
                requests: { cpu: "100m", memory: "128Mi" }
                limits: { cpu: "1000m", memory: "384Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              imagePullPolicy: IfNotPresent
              env:
                - name: FOMOXA_DIRECTORY
                  value: "directory.fomoxa.svc.cluster.local:9500"
                - name: POD_KEY_FILE
                  value: "/secrets/pod/pod"
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: FOMOXA_POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: FOMOXA_POD_PORT
                  value: "7778"
                - name: FOMOXA_VERSION
                  value: "1.0"
                - name: FOMOXA_REGION
                  value: "local"
                - name: FOMOXA_AGONES
                  value: "true"
                - name: FOMOXA_CLAIM_ONE
                  value: "true"
                - name: FOMOXA_BACKEND
                  value: "backend-pods.fomoxa.svc.cluster.local:9602"
                - name: POD_BACKEND_KEY_FILE
                  value: "/secrets/backend-pod/backend-pod"
                - name: FOMOXA_METRICS
                  value: "0.0.0.0:9611"
                # Đủ phòng cho FleetAutoscaler (tối đa 16 pod); mỗi pod claim một phòng còn trống.
                - name: FOMOXA_ROOM
                  value: "arena:1,arena:2,arena:3,arena:4,arena:5,arena:6,arena:7,arena:8,arena:9,arena:10,arena:11,arena:12,arena:13,arena:14,arena:15,arena:16"
              volumeMounts:
                - name: pod-key
                  mountPath: /secrets/pod
                  readOnly: true
                - name: backend-pod-key
                  mountPath: /secrets/backend-pod
                  readOnly: true
          volumes:
            - name: pod-key
              secret:
                secretName: fomoxa-pod-key
            - name: backend-pod-key
              secret:
                secretName: fomoxa-backend-pod-key

