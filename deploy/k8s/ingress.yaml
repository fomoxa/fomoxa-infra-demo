# THỬ NGHIỆM - KHÔNG được k8s-up áp dụng mặc định (đặt APPLY_INGRESS=1 để áp dụng).
#
# Chưa phải hardening production:
#   - Chưa có TLS (cần cert-manager hoặc Secret TLS + spec.tls).
#   - Chỉ route HTTP/WebSocket. Cổng 9600 của backend là fRPC qua TCP thô nên KHÔNG đi qua
#     Ingress HTTP được; client kết nối thẳng vào Service LoadBalancer `backend` (9600).
#   - k3s/k3d dùng Traefik (ingressClass "traefik"), không phải NGINX.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fomoxa-ingress
  namespace: fomoxa
spec:
  ingressClassName: traefik
  rules:
    - host: fomoxa.local
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 9601
