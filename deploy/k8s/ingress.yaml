apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fomoxa-ingress
  namespace: fomoxa
  annotations:
    # NGINX Ingress Controller annotations cho TLS va rate limiting
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "backend"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  rules:
    - host: fomoxa.local
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 9601
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 9600

