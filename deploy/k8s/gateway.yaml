apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: fomoxa
data:
  gateway.toml: |
    listen = "0.0.0.0:7777"
    pod_bind = "0.0.0.0:0"
    directory = "directory.fomoxa.svc.cluster.local:9500"
    retry_seconds = 1

    [keys]
    gateway = { file = "/secrets/directory/gateway" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fomoxa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: fomoxa-gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["/config/gateway.toml"]
          ports:
            - name: game
              containerPort: 7777
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets/directory
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gateway-config
        - name: secrets
          secret:
            secretName: fomoxa-directory-keys
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: fomoxa
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: game
      port: 7777
      targetPort: 7777
      protocol: UDP
